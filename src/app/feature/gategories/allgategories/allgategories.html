<div class="hero-gradient py-18 px-6">

    <div class="max-w-screen-2xl mx-auto">
        <!-- Breadcrumb -->
        <nav class="text-sm text-white/80 mb-6">
            <ol class="flex items-center space-x-2">
                <li>
                    <a routerLink="/home" class="hover:underline">Home</a>
                </li>
                <li>/</li>
                <li class="text-white font-medium">Categories</li>
            </ol>
        </nav>

        <!-- Header Content -->
        <div class="flex items-center space-x-4">

            <!-- Icon Box -->
            <div class="w-16 h-16 flex items-center justify-center bg-white/20 rounded-xl backdrop-blur">
                <!-- Flowbite icon (Heroicons) -->
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10" />
                </svg>
            </div>

            <!-- Title + Subtitle -->
            <div>
                <h1 class="text-4xl font-bold text-white">All Categories</h1>
                <p class="text-white/80 mt-1 text-sm ">
                    Browse our wide range of product categories
                </p>
            </div>

        </div>
    </div>
</div>

<section class="bg-white py-10 max-w-screen-2xl mx-auto">

    <!-- Categories Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
        @for (category of categories(); track category._id) {

        <div  class="group flex flex-col cursor-pointer">

            <!-- Image Card -->
            <div
                class="relative w-full aspect-[4/4] bg-gray-50 rounded-2xl overflow-hidden border border-gray-100 group-hover:border-green-400 group-hover:shadow-md transition-all duration-200">

                <!-- Image -->
                <img [src]="category.image" [alt]="category.name"
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                    onerror="this.src='https://placehold.co/300x300/f0fdf4/22c55e?text=?'" />

                <!-- Overlay label (shown on hover or if subcategory exists) -->
                <div
                    class="absolute bottom-0 left-0 right-0 bg-green-500/80 px-3 py-2 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                    <span class="text-white text-xs font-medium">{{ category.name }}</span>
                </div>

            </div>

            <!-- Name + Link below card -->
            <div class="pt-3 px-1">
                <p class="text-sm font-bold text-gray-800 group-hover:text-green-600 transition-colors">
                    {{ category.name }}
                </p>

                <a href="#" class="inline-flex items-center gap-1 text-xs text-green-600 mt-1 opacity-0 group-hover:opacity-100
                transition-opacity duration-200">
                    View Subcategories
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </a>
            </div>

        </div>

        }
    </div>


</section>
