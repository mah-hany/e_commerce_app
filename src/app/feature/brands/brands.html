<div class="custom-gradient py-18 px-6">

    <div class="max-w-screen-2xl mx-auto">
        <!-- Breadcrumb -->
        <nav class="text-sm text-white/80 mb-6">
            <ol class="flex items-center space-x-2">
                <li>
                    <a routerLink="/home" class="hover:underline">Home</a>
                </li>
                <li>/</li>
                <li class="text-white font-medium">Brands</li>
            </ol>
        </nav>

        <!-- Header Content -->
        <div class="flex items-center space-x-4">

            <!-- Icon Box -->
            <div class="w-16 h-16 flex items-center justify-center bg-white/20 rounded-xl backdrop-blur">
                <!-- Flowbite icon (Heroicons) -->
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10" />
                </svg>
            </div>

            <!-- Title + Subtitle -->
            <div>
                <h1 class="text-4xl font-bold text-white">Top Brands</h1>
                <p class="text-white/80 mt-1 text-sm ">
                    Shop from your favorite brands
                </p>
            </div>

        </div>
    </div>
</div>


<section class="bg-white py-10 max-w-screen-2xl mx-auto">


    <!-- products -->
    <div class="grid gap-4 grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6">
        @for (brand of brandslist(); track $index) {
        <div class="max-w-sm p-6 bg-white border border-gray-200 rounded-2xl shadow-sm 
            hover:shadow-md transition duration-300 text-center group">

            <!-- Image Wrapper -->
            <div class="bg-gray-100 rounded-xl p-6 mb-5">
                <img [src]="brand.image" [alt]="brand.name"
                    class="mx-auto h-40 object-contain" />
            </div>

            <!-- Title -->
            <h3 class="text-lg font-semibold text-gray-800 group-hover:text-purple-600 transition">
                {{ brand.name }}
            </h3>

            <!-- Link -->
            <a href="#" class="mt-2 inline-flex items-center text-sm text-purple-600 font-medium opacity-0 
            group-hover:opacity-100 transition">
                View Products
                <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </a>

        </div>
        }
    </div>
</section>
